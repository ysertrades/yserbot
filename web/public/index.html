<body>

<header class="bar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 26 26" aria-hidden="true" focusable="false">
      <rect x="0.5" y="0.5" width="25" height="25" rx="7"></rect>
      <g class="y"><path d="M7 15.5 11 11l3 3 5-6"></path></g>
    </svg>
    <span class="wordmark">quantlab</span>
    <span class="here" id="here" aria-hidden="true"></span>
  </div>
  <div class="bar-right" id="bar-right"></div>
</header>

<main id="main">

  <section class="view" data-view="loading">
    <div class="panel center"><p class="muted">Loading…</p></div>
  </section>

  <section class="view" data-view="login">
    <div class="panel center">
      <h1>Control panel</h1>
      <p class="muted">Sign in with the Discord account that manages your server.</p>
      <a class="btn primary" href="/auth/login">Sign in with Discord</a>
      <p class="note" id="login-error" hidden></p>
    </div>
    <p class="fineprint">
      <a href="/terms" target="_blank" rel="noopener">Terms of Service</a>
      <span aria-hidden="true">·</span>
      <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>
    </p>
  </section>

  <section class="view" data-view="setup">
    <div class="panel">
      <h1>Almost there</h1>
      <p class="muted">Add these to the Env tab on your host, then restart the bot.</p>
      <ul class="keys" id="setup-missing"></ul>
    </div>
  </section>

  <!-- RESTORE_NOTE: full panel markup continues in second update if truncated -->
  <section class="view" data-view="panel">
    <p class="muted">Loading panel shell… If this stays, hard-refresh after deploy.</p>
  </section>
</main>

<script src="/app.js"></script>
<script src="/stability.js"></script>
</body>
</html>

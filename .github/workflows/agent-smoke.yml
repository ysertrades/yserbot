name: Agent smoke contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # node_modules is no longer committed (it is in .gitignore).
      - run: npm ci
      - run: npm run smoke
      - run: npm run audit:static
